<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Noticlima · Notilea | IA Meteorológica</title>
    <!-- Fuentes, iconos y librerías externas ligeras -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0b1120, #030712);
            color: #eef2ff;
            padding: 20px 16px 40px;
            min-height: 100vh;
        }

        /* scroll suave */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 10px;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
        }

        /* header y búsqueda */
        .brand {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5f3fc, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }
        .sub {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin: 16px 0 20px;
        }
        .search-box input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 12px 16px;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        .search-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59,130,246,0.3);
        }
        .search-box button {
            background: #3b82f6;
            border: none;
            padding: 0 20px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-box button:active { transform: scale(0.96); background: #2563eb; }
        .gps-btn {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 40px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }
        .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* tarjetas clima actual */
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .metric-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 14px 12px;
            border: 1px solid rgba(59,130,246,0.2);
            transition: 0.2s;
        }
        .metric-card i {
            font-size: 1.4rem;
            color: #60a5fa;
            margin-right: 8px;
        }
        .metric-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9ca3af;
        }
        .metric-value {
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .temp-main {
            grid-column: span 2;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .big-temp {
            font-size: 2.8rem;
            font-weight: 800;
        }
        /* IA card */
        .ia-card {
            background: rgba(59,130,246,0.1);
            border-left: 4px solid #3b82f6;
            border-radius: 24px;
            padding: 18px;
            margin: 20px 0;
        }
        .ia-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ia-title i {
            font-size: 1.2rem;
            color: #facc15;
        }
        .ia-text {
            color: #cbd5e1;
            line-height: 1.4;
            font-size: 0.9rem;
        }

        /* pestañas */
        .tabs {
            display: flex;
            gap: 8px;
            background: #0f172a80;
            border-radius: 48px;
            padding: 6px;
            margin: 20px 0 16px;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 600;
            color: #cbd5e1;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            box-shadow: 0 4px 10px rgba(59,130,246,0.3);
        }
        .forecast-panel {
            display: none;
            background: #0f172a60;
            border-radius: 32px;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        .forecast-panel.active-panel {
            display: block;
        }
        .chart-container {
            margin: 16px 0;
            height: 220px;
        }
        canvas {
            max-height: 220px;
            width: 100%;
        }
        .daily-list {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 8px 4px;
        }
        .daily-item {
            background: #1e293b;
            border-radius: 24px;
            padding: 12px;
            min-width: 100px;
            text-align: center;
        }
        .daily-day {
            font-weight: 600;
            font-size: 0.85rem;
        }
        .daily-temp {
            font-size: 1.3rem;
            font-weight: 700;
        }
        .error-msg {
            color: #f87171;
            text-align: center;
            background: #7f1a1a30;
            border-radius: 20px;
            padding: 12px;
        }
        footer {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 32px;
            color: #475569;
        }
        @media (max-width: 460px) {
            .metric-value { font-size: 1.3rem; }
            .big-temp { font-size: 2.2rem; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="brand">
        <div>
            <h1>🌦️ Noticlima</h1>
            <div class="sub">by Notilea · inteligencia climática</div>
        </div>
        <button id="gpsButton" class="gps-btn"><i class="fas fa-location-dot"></i> GPS</button>
    </div>

    <div class="search-box">
        <input type="text" id="cityInput" placeholder="Buscar ciudad... (Ej: Madrid, Bogotá)" autocomplete="off">
        <button id="searchBtn"><i class="fas fa-search"></i> Buscar</button>
    </div>

    <div id="weatherContent">
        <!-- carga inicial -->
        <div class="loading"><div class="spinner"></div><p>Obteniendo ubicación y datos meteorológicos...</p></div>
    </div>

    <footer>Open-Meteo · Datos en tiempo real | Pronóstico IA integrado</footer>
</div>

<script>
    // ---------- ESTADO GLOBAL ----------
    let currentWeatherData = null;      // almacena hourly, daily, timezone, currentIndex, uv, etc
    let activeChart = null;             // instancia chart.js
    let activeTab = "hourly";           // hourly, day7, day15

    // Elementos dinámicos
    const weatherContainer = document.getElementById('weatherContent');
    const gpsBtn = document.getElementById('gpsButton');
    const searchBtn = document.getElementById('searchBtn');
    const cityInput = document.getElementById('cityInput');

    // Geocoding (Open-Meteo)
    async function geocodeCity(cityName) {
        try {
            const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=es&format=json`);
            const data = await res.json();
            if (data.results && data.results.length > 0) {
                const { latitude, longitude, name, country } = data.results[0];
                return { lat: latitude, lon: longitude, displayName: `${name}, ${country || ''}` };
            } else {
                throw new Error("Ciudad no encontrada");
            }
        } catch (err) {
            throw new Error("Error en búsqueda: " + err.message);
        }
    }

    // Obtener datos completos de Open-Meteo (hourly + daily 16 días)
    async function fetchWeatherByCoords(lat, lon, locationName = null) {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,apparent_temperature,relativehumidity_2m,dewpoint_2m,precipitation_probability,windspeed_10m,winddirection_10m,pressure_msl,cloudcover&daily=uv_index_max,temperature_2m_max,temperature_2m_min,precipitation_probability_mean,windspeed_10m_max,winddirection_10m_dominant&timezone=auto&forecast_days=16`;
        const response = await fetch(url);
        if (!response.ok) throw new Error("Error al obtener datos climáticos");
        const data = await response.json();
        
        // Procesar datos para encontrar índice actual en hourly
        const hourly = data.hourly;
        const daily = data.daily;
        const timezone = data.timezone;
        
        // Obtener hora actual local según el navegador para coincidir con los tiempos devueltos (timezone=auto)
        const now = new Date();
        // Los tiempos vienen como strings ISO en la zona horaria local (YYYY-MM-DDTHH:00)
        const timeStrings = hourly.time;
        let currentIndex = 0;
        // buscar el índice más cercano a la hora actual (redondeado)
        const currentHourStr = now.toISOString().slice(0, 13) + ":00"; // UTC, pero Open-Meteo con timezone=auto devuelve local 
        // alternativa: usar la hora local forzada comparando con el primer elemento y offset
        // Mejor: buscar comparando fecha local sin UTC: extraer del array la primera hora y ajustar.
        if (timeStrings.length > 0) {
            const referenceDate = new Date(timeStrings[0]);
            const offsetMs = now.getTime() - referenceDate.getTime();
            const hourMs = 60 * 60 * 1000;
            const approxIndex = Math.floor(offsetMs / hourMs);
            currentIndex = Math.min(Math.max(approxIndex, 0), hourly.temperature_2m.length - 1);
        }
        
        // Obtener UV del día actual (primer día del daily)
        const currentUV = daily.uv_index_max[0] ?? "N/D";
        // Construir objeto resumido
        const weatherSummary = {
            lat, lon,
            location: locationName || `${lat.toFixed(2)}, ${lon.toFixed(2)}`,
            hourly,
            daily,
            currentIndex,
            timezone,
            uvIndex: currentUV,
            dailyData: daily
        };
        return weatherSummary;
    }

    // Análisis IA (heurística inteligente)
    function generateAIAnalysis(data, currentMetrics) {
        const { temp, feelsLike, humidity, windSpeed, uv, rainProb, clouds } = currentMetrics;
        let analisis = "";
        if (temp > 30) analisis += "🔥 Calor extremo, hidrátate y evita el sol de mediodía. ";
        else if (temp < 5) analisis += "❄️ Temperatura muy baja, abrígate bien. ";
        else if (temp < 15) analisis += "🍃 Fresco, ideal para una chaqueta ligera. ";
        else analisis += "🌤️ Temperatura agradable, disfruta el día. ";
        
        if (rainProb > 70) analisis += "🌧️ Alta probabilidad de lluvia, no olvides paraguas. ";
        else if (rainProb > 40) analisis += "☔ Posibilidad de lluvia moderada, ten precaución. ";
        else analisis += "☀️ Baja probabilidad de lluvia, excelente para outdoor. ";
        
        if (uv > 7) analisis += "🧴 Índice UV extremo: usa protector solar y gafas. ";
        else if (uv > 4) analisis += "😎 Índice UV moderado, protección solar recomendada. ";
        
        if (humidity > 80) analisis += "💧 Alta humedad, sensación de bochorno. ";
        if (windSpeed > 30) analisis += "💨 Viento intenso, cuidado con ráfagas. ";
        
        if (clouds > 80) analisis += "☁️ Cielos muy nublados, poco sol visible.";
        else if (clouds < 20) analisis += "✨ Cielo despejado, vista estupenda.";
        
        return analisis.trim() || "Condiciones estables, sin alertas significativas.";
    }
    
    // Renderizar la UI principal: métricas + IA + pestañas
    function renderFullUI(weatherData) {
        if (!weatherData) return;
        const hourly = weatherData.hourly;
        const idx = weatherData.currentIndex;
        const dailyArr = weatherData.daily;
        
        // Extraer datos actuales
        const temp = hourly.temperature_2m[idx];
        const feelsLike = hourly.apparent_temperature[idx];
        const humidity = hourly.relativehumidity_2m[idx];
        const pressure = hourly.pressure_msl[idx];
        const windSpeed = hourly.windspeed_10m[idx];
        const windDirDeg = hourly.winddirection_10m[idx];
        const dewPoint = hourly.dewpoint_2m[idx];
        const rainProb = hourly.precipitation_probability[idx];
        const clouds = hourly.cloudcover[idx];
        const uv = weatherData.uvIndex;
        
        // Dirección del viento en texto
        const windCardinal = (deg) => {
            if (deg === undefined) return "N/D";
            const val = Math.floor(deg / 22.5 + 0.5);
            const dirs = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSO", "SO", "OSO", "O", "ONO", "NO", "NNO"];
            return dirs[val % 16];
        };
        const windDirText = windCardinal(windDirDeg);
        
        const currentMetrics = { temp, feelsLike, humidity, windSpeed, uv, rainProb, clouds, pressure, dewPoint };
        
        // Análisis IA
        const iaText = generateAIAnalysis(weatherData, currentMetrics);
        
        // Construir HTML principal
        const html = `
            <div class="weather-grid">
                <div class="metric-card temp-main">
                    <div>
                        <div class="metric-title">TEMPERATURA</div>
                        <div class="big-temp">${Math.round(temp)}°</div>
                        <div style="font-size:0.8rem">Sensación: ${Math.round(feelsLike)}°</div>
                    </div>
                    <i class="fas fa-sun" style="font-size:3rem; opacity:0.8"></i>
                </div>
                <div class="metric-card"><i class="fas fa-tint"></i><div class="metric-title">Humedad</div><div class="metric-value">${Math.round(humidity)}%</div></div>
                <div class="metric-card"><i class="fas fa-gauge-high"></i><div class="metric-title">Presión</div><div class="metric-value">${Math.round(pressure)} hPa</div></div>
                <div class="metric-card"><i class="fas fa-wind"></i><div class="metric-title">Viento</div><div class="metric-value">${Math.round(windSpeed)} km/h</div><div style="font-size:0.7rem">${windDirText}</div></div>
                <div class="metric-card"><i class="fas fa-droplet"></i><div class="metric-title">Punto Rocío</div><div class="metric-value">${Math.round(dewPoint)}°</div></div>
                <div class="metric-card"><i class="fas fa-cloud-rain"></i><div class="metric-title">Lluvia</div><div class="metric-value">${rainProb}%</div></div>
                <div class="metric-card"><i class="fas fa-cloud"></i><div class="metric-title">Nubosidad</div><div class="metric-value">${Math.round(clouds)}%</div></div>
                <div class="metric-card"><i class="fas fa-sun"></i><div class="metric-title">Índice UV</div><div class="metric-value">${uv}</div></div>
            </div>
            <div class="ia-card">
                <div class="ia-title"><i class="fas fa-microchip"></i> Noticlima IA · Análisis inteligente</div>
                <div class="ia-text">🧠 ${iaText}</div>
            </div>
            <div class="tabs">
                <button class="tab-btn ${activeTab === 'hourly' ? 'active' : ''}" data-tab="hourly">📊 Por hora</button>
                <button class="tab-btn ${activeTab === 'day7' ? 'active' : ''}" data-tab="day7">📆 7 días</button>
                <button class="tab-btn ${activeTab === 'day15' ? 'active' : ''}" data-tab="day15">📅 15 días</button>
            </div>
            <div id="forecastPanels">
                <div id="panel-hourly" class="forecast-panel ${activeTab === 'hourly' ? 'active-panel' : ''}">
                    <div class="chart-container"><canvas id="hourlyChartCanvas"></canvas></div>
                    <p style="font-size:0.7rem; text-align:center">🌡️ Temperatura (°C) y 🌧️ Prob. lluvia (%) próximas 48h</p>
                </div>
                <div id="panel-day7" class="forecast-panel ${activeTab === 'day7' ? 'active-panel' : ''}">
                    <div class="chart-container"><canvas id="daily7ChartCanvas"></canvas></div>
                    <div class="daily-list" id="daily7List"></div>
                </div>
                <div id="panel-day15" class="forecast-panel ${activeTab === 'day15' ? 'active-panel' : ''}">
                    <div class="chart-container"><canvas id="daily15ChartCanvas"></canvas></div>
                    <div class="daily-list" id="daily15List"></div>
                </div>
            </div>
        `;
        weatherContainer.innerHTML = html;
        
        // Guardar referencia de datos
        currentWeatherData = weatherData;
        
        // Renderizar gráficos y listas según tab activo
        renderChartByActiveTab();
        attachTabEvents();
        renderDailyLists();
    }
    
    function attachTabEvents() {
        const btns = document.querySelectorAll('.tab-btn');
        btns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const tab = btn.dataset.tab;
                activeTab = tab;
                // Cambiar active visual
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.forecast-panel').forEach(panel => panel.classList.remove('active-panel'));
                if (tab === 'hourly') document.getElementById('panel-hourly').classList.add('active-panel');
                if (tab === 'day7') document.getElementById('panel-day7').classList.add('active-panel');
                if (tab === 'day15') document.getElementById('panel-day15').classList.add('active-panel');
                renderChartByActiveTab();
                renderDailyLists(); // refrescar listas si necesario
            });
        });
    }
    
    function renderDailyLists() {
        if (!currentWeatherData) return;
        const daily = currentWeatherData.dailyData;
        if (!daily) return;
        const daysCount = daily.time.length;
        // 7 días list
        const list7 = document.getElementById('daily7List');
        if (list7) {
            list7.innerHTML = '';
            for (let i = 0; i < Math.min(7, daysCount); i++) {
                const date = new Date(daily.time[i]);
                const dayName = date.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' });
                const maxT = Math.round(daily.temperature_2m_max[i]);
                const minT = Math.round(daily.temperature_2m_min[i]);
                const rain = daily.precipitation_probability_mean[i] ?? 0;
                list7.innerHTML += `<div class="daily-item"><div class="daily-day">${dayName}</div><div class="daily-temp">${maxT}°/${minT}°</div><div><i class="fas fa-umbrella"></i> ${Math.round(rain)}%</div></div>`;
            }
        }
        const list15 = document.getElementById('daily15List');
        if (list15) {
            list15.innerHTML = '';
            for (let i = 0; i < Math.min(15, daysCount); i++) {
                const date = new Date(daily.time[i]);
                const dayName = date.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' });
                const maxT = Math.round(daily.temperature_2m_max[i]);
                const minT = Math.round(daily.temperature_2m_min[i]);
                const rain = daily.precipitation_probability_mean[i] ?? 0;
                list15.innerHTML += `<div class="daily-item"><div class="daily-day">${dayName}</div><div class="daily-temp">${maxT}°/${minT}°</div><div><i class="fas fa-umbrella"></i> ${Math.round(rain)}%</div></div>`;
            }
        }
    }
    
    function renderChartByActiveTab() {
        if (!currentWeatherData) return;
        if (activeChart) {
            activeChart.destroy();
            activeChart = null;
        }
        if (activeTab === 'hourly') {
            const hourly = currentWeatherData.hourly;
            const times = hourly.time;
            // tomar 48 horas (siguientes 2 días)
            const startIdx = currentWeatherData.currentIndex;
            const limit = Math.min(48, times.length - startIdx);
            const labels = [];
            const temps = [];
            const rainProbs = [];
            for (let i = 0; i < limit; i++) {
                const idx = startIdx + i;
                if (idx >= times.length) break;
                const hourDate = new Date(times[idx]);
                const hourStr = hourDate.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' });
                labels.push(hourStr);
                temps.push(hourly.temperature_2m[idx]);
                rainProbs.push(hourly.precipitation_probability[idx] ?? 0);
            }
            const ctx = document.getElementById('hourlyChartCanvas')?.getContext('2d');
            if (!ctx) return;
            activeChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '🌡️ Temperatura (°C)', data: temps, borderColor: '#f97316', backgroundColor: 'transparent', tension: 0.3, pointRadius: 2, yAxisID: 'y' },
                        { label: '☔ Prob. lluvia (%)', data: rainProbs, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', type: 'bar', yAxisID: 'y1', borderRadius: 6 }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: true,
                    plugins: { tooltip: { mode: 'index' }, legend: { labels: { color: '#cbd5e1' } } },
                    scales: { y: { title: { display: true, text: 'Temperatura °C', color: '#ccc' }, grid: { color: '#334155' } }, y1: { position: 'right', title: { text: 'Probabilidad %', color: '#ccc' }, min: 0, max: 100, grid: { drawOnChartArea: false } }, x: { ticks: { color: '#94a3b8', maxRotation: 45 } } }
                }
            });
        } 
        else if (activeTab === 'day7') {
            const daily = currentWeatherData.dailyData;
            const maxDays = Math.min(7, daily.time.length);
            const labels = [];
            const maxTemps = [];
            const minTemps = [];
            for (let i = 0; i < maxDays; i++) {
                const date = new Date(daily.time[i]);
                labels.push(date.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }));
                maxTemps.push(daily.temperature_2m_max[i]);
                minTemps.push(daily.temperature_2m_min[i]);
            }
            const ctx = document.getElementById('daily7ChartCanvas')?.getContext('2d');
            if (!ctx) return;
            activeChart = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [
                    { label: 'Máxima °C', data: maxTemps, backgroundColor: '#f97316', borderRadius: 8 },
                    { label: 'Mínima °C', data: minTemps, backgroundColor: '#3b82f6', borderRadius: 8 }
                ] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { y: { title: { display: true, text: 'Temperatura (°C)' }, grid: { color: '#334155' } }, x: { ticks: { color: '#cbd5e1' } } } }
            });
        } 
        else if (activeTab === 'day15') {
            const daily = currentWeatherData.dailyData;
            const maxDays = Math.min(15, daily.time.length);
            const labels = [];
            const maxTemps = [];
            const minTemps = [];
            for (let i = 0; i < maxDays; i++) {
                const date = new Date(daily.time[i]);
                labels.push(date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }));
                maxTemps.push(daily.temperature_2m_max[i]);
                minTemps.push(daily.temperature_2m_min[i]);
            }
            const ctx = document.getElementById('daily15ChartCanvas')?.getContext('2d');
            if (!ctx) return;
            activeChart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets: [
                    { label: 'Máxima °C', data: maxTemps, borderColor: '#f97316', fill: false, tension: 0.2, pointBackgroundColor: '#f97316' },
                    { label: 'Mínima °C', data: minTemps, borderColor: '#60a5fa', fill: false, tension: 0.2 }
                ] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { labels: { color: '#cbd5e1' } } }, scales: { y: { title: { display: true, text: 'Temperatura °C' }, grid: { color: '#334155' } }, x: { ticks: { color: '#94a3b8', rotation: 35 } } } }
            });
        }
    }
    
    // Cargar datos y pintar todo
    async function loadAndRender(lat, lon, displayName = null) {
        weatherContainer.innerHTML = `<div class="loading"><div class="spinner"></div><p>Sincronizando con Open-Meteo...</p></div>`;
        try {
            const weather = await fetchWeatherByCoords(lat, lon, displayName);
            renderFullUI(weather);
        } catch (err) {
            weatherContainer.innerHTML = `<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> Error: ${err.message}<br>Intenta otra ciudad o activa GPS</div>`;
            console.error(err);
        }
    }
    
    // GPS automático
    function getLocationAndFetch() {
        if (!navigator.geolocation) {
            weatherContainer.innerHTML = `<div class="error-msg">GPS no soportado. Busca manualmente.</div>`;
            return;
        }
        weatherContainer.innerHTML = `<div class="loading"><div class="spinner"></div><p>Accediendo a GPS...</p></div>`;
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const { latitude, longitude } = position.coords;
                loadAndRender(latitude, longitude, "Mi ubicación");
            },
            (error) => {
                let errMsg = "Permiso denegado o error GPS. Usa búsqueda manual.";
                if (error.code === 1) errMsg = "Permiso de ubicación denegado. Busca ciudad manualmente.";
                weatherContainer.innerHTML = `<div class="error-msg"><i class="fas fa-map-marker-alt"></i> ${errMsg}</div><div class="metric-card" style="text-align:center; margin-top:12px;">Ejemplo: Madrid</div>`;
                // fallback suave: Madrid demo
                loadAndRender(40.4165, -3.7026, "Madrid, España");
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    }
    
    // Búsqueda manual
    async function handleCitySearch() {
        const city = cityInput.value.trim();
        if (city === "") return;
        weatherContainer.innerHTML = `<div class="loading"><div class="spinner"></div><p>Buscando "${city}"...</p></div>`;
        try {
            const geo = await geocodeCity(city);
            loadAndRender(geo.lat, geo.lon, geo.displayName);
        } catch (err) {
            weatherContainer.innerHTML = `<div class="error-msg"><i class="fas fa-city"></i> No se encontró "${city}". Intenta otro nombre.</div>`;
        }
    }
    
    // Eventos iniciales
    gpsBtn.addEventListener('click', () => getLocationAndFetch());
    searchBtn.addEventListener('click', () => handleCitySearch());
    cityInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleCitySearch(); });
    
    // Iniciar con GPS automático al cargar
    getLocationAndFetch();
</script>
</body>
</html>
